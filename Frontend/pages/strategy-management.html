<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy Management</title>

    <!-- Link external styling stylesheets -->
    <link rel="stylesheet" href="../css/pages/common.css">
    <link rel="stylesheet" href="../css/pages/dashboard.css">
    <style>
        /* Custom UI helpers */
        .management-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-md);
        }
        .btn-create {
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow-premium);
            transition: opacity 0.2s ease;
        }
        .btn-create:hover {
            opacity: 0.9;
        }
        .info-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
        }
        .badge-active {
            background-color: #dcfce7;
            color: #166534;
        }
        .badge-inactive {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .action-icon-btn {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-icon-btn:hover {
            background-color: #f4f4f5;
            border-color: #d4d4d8;
        }
        .action-icon-btn.btn-disable {
            color: #dc2626;
            border-color: #fecaca;
        }
        .action-icon-btn.btn-disable:hover {
            background-color: #fef2f2;
        }
        .action-icon-btn.btn-enable {
            color: #16a34a;
            border-color: #bbf7d0;
        }
        .action-icon-btn.btn-enable:hover {
            background-color: #f0fdf4;
        }

        /* --- Modal Backdrop & Box styling --- */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: none; /* hidden by default */
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
        }
        .modal-backdrop.show {
            display: flex;
        }
        .modal-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 480px;
            box-shadow: var(--shadow-premium);
            overflow: hidden;
            animation: modalFadeIn 0.3s ease-out;
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
        }
        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .form-input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 13px;
            background-color: #ffffff;
            color: var(--text-primary);
            outline: none;
        }
        .form-input:focus {
            border-color: var(--color-primary);
        }
        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background-color: #fafafa;
        }
        .btn-cancel {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancel:hover {
            background-color: #f4f4f5;
        }
        
        /* Submit Button Styling and Disabled States */
        .btn-submit {
            background-color: #0284c7;
            border: none;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-submit:hover:not(:disabled) {
            opacity: 0.9;
        }
        .btn-submit:disabled {
            background-color: #f4f4f5;
            border: 1px solid #d4d4d8;
            color: #71717a;
            cursor: not-allowed;
            box-shadow: none;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header class="app-header" id="header-section">
        <div class="header-container">
            <div class="header-left">
                <!-- SVG Icon mimicking TradingView/Zerodha style -->
                <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <h1>Strategy Management</h1>
            </div>
            <!-- Connection status indicator & Header info -->
            <div class="header-right">
                <span id="header-clock" class="header-clock">--:--:-- --</span>
                <button class="theme-toggle" aria-label="Toggle Theme">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="dashboard-container" id="dashboard-layout">
        <section class="stocks-section" aria-label="Strategy List Control Console">
            <div class="management-actions-row">
                <h2>Active Strategy Catalog</h2>
                <button class="btn-create" id="btn-create-strategy">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Create Strategy
                </button>
            </div>

            <div class="table-responsive">
                <table class="stocks-table" id="strategy-table" style="table-layout: fixed; width: 100%;">
                    <thead>
                        <tr>
                            <th scope="col" style="width: 15%; text-align: center;">Strategy ID</th>
                            <th scope="col" style="width: 25%; text-align: left;">Strategy Name</th>
                            <th scope="col" style="width: 25%; text-align: left;">Description</th>
                            <th scope="col" style="width: 15%; text-align: center;">Platform Status</th>
                            <th scope="col" style="width: 20%; text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="strategy-table-body">
                        <tr>
                            <td colspan="5" class="text-center" style="color: var(--text-secondary); padding: 24px;">Loading strategies from database...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal Form Dialog for Create/Edit Strategy -->
    <div class="modal-backdrop" id="create-modal-backdrop">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title-text">Create New Strategy</h3>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="input-strategy-name">Strategy Name *</label>
                    <input type="text" class="form-input" id="input-strategy-name" placeholder="e.g. Pivot Breakout" required>
                </div>
                <div class="form-group">
                    <label for="input-strategy-desc">Description</label>
                    <input type="text" class="form-input" id="input-strategy-desc" placeholder="Details about this strategy parameters">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="btn-close-modal">Cancel</button>
                <button class="btn-submit" id="btn-save-strategy" disabled>Create</button>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        <div class="footer-container">
            <div class="market-breadth">
                <span class="breadth-item">Strategy Administration Panel</span>
            </div>
            <div class="footer-right">
                <span class="last-updated">Last updated: <span id="last-updated-time">--:--:-- --</span></span>
            </div>
        </div>
    </footer>

    <!-- Load application scripts -->
    <script src="../js/api/config.js"></script>
    <script src="../js/common.js"></script>

    <!-- Frontend Interactive controller script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnCreate = document.getElementById('btn-create-strategy');
            const backdrop = document.getElementById('create-modal-backdrop');
            const btnClose = document.getElementById('btn-close-modal');
            const btnSave = document.getElementById('btn-save-strategy');
            const tableBody = document.getElementById('strategy-table-body');
            const elLastUpdated = document.getElementById('last-updated-time');
            const elModalTitle = document.getElementById('modal-title-text');

            // Form inputs
            const inputName = document.getElementById('input-strategy-name');
            const inputDesc = document.getElementById('input-strategy-desc');

            // Local state to track which strategy we are currently editing (null = creating new)
            let editingStrategyId = null;
            let loadedStrategiesList = []; // Holds strategy records loaded from backend

            // Update Time
            function updateLastUpdated() {
                if (elLastUpdated) {
                    const now = new Date();
                    elLastUpdated.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
                }
            }

            // Real-time text validation to toggle "Save" button disabled property
            inputName.addEventListener('input', () => {
                btnSave.disabled = inputName.value.trim().length === 0;
            });

            // Open Modal in CREATE mode
            btnCreate.addEventListener('click', () => {
                editingStrategyId = null;
                elModalTitle.textContent = "Create New Strategy";
                btnSave.textContent = "Create";
                
                inputName.value = '';
                inputDesc.value = '';
                btnSave.disabled = true;
                backdrop.classList.add('show');
                inputName.focus();
            });

            // Close Modal
            const closeModal = () => {
                backdrop.classList.remove('show');
            };
            btnClose.addEventListener('click', closeModal);

            // Close modal on clicking backdrop directly
            backdrop.addEventListener('click', (e) => {
                if (e.target === backdrop) {
                    closeModal();
                }
            });

            // Fetch strategies from the backend and populate the UI table
            async function loadStrategies() {
                const accessToken = localStorage.getItem('access_token');
                if (!accessToken) {
                    window.location.replace('login.html');
                    return;
                }

                try {
                    const response = await fetch(`${window.API_BASE_URL}/api/v1/master/strategies`, {
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        if (response.status === 401 || response.status === 403) {
                            window.location.replace('login.html');
                        }
                        throw new Error(`Server returned error status: ${response.status}`);
                    }

                    loadedStrategiesList = await response.json();
                    renderStrategies(loadedStrategiesList);
                    updateLastUpdated();
                } catch (error) {
                    console.error("Failed to load strategy catalog:", error);
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center" style="color: var(--color-negative); padding: 24px; font-weight: 600;">
                                Error loading strategies from database.
                            </td>
                        </tr>
                    `;
                }
            }

            // Render catalog items to DOM
            function renderStrategies(strategies) {
                tableBody.innerHTML = '';

                if (strategies.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="text-center" style="color: var(--text-secondary); padding: 24px;">No strategies created in catalog yet.</td>
                        </tr>
                    `;
                    return;
                }

                strategies.forEach(strat => {
                    const tr = document.createElement('tr');
                    
                    // Conditionally set up toggle button labels
                    const toggleActionLabel = strat.is_active ? "Disable" : "Enable";
                    const toggleActionClass = strat.is_active ? "btn-disable" : "btn-enable";

                      tr.innerHTML = `
                        <td style="width: 15%; text-align: center; font-family: monospace; font-weight: 600;">${strat.id}</td>
                        <td style="width: 25%; text-align: left; font-weight: 600;">${strat.name}</td>
                        <td style="width: 25%; text-align: left; color: var(--text-secondary); word-break: break-word;">${strat.description || 'No description provided.'}</td>
                        <td style="width: 15%; text-align: center;">
                            <span class="info-badge ${strat.is_active ? 'badge-active' : 'badge-inactive'}">
                                ${strat.is_active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td style="width: 20%; text-align: center;">
                            <div style="display: flex; justify-content: center; gap: 8px;">
                                <button class="action-icon-btn btn-edit-action" data-id="${strat.id}">Edit</button>
                                <button class="action-icon-btn ${toggleActionClass} btn-toggle-status-action" data-id="${strat.id}" data-name="${strat.name}" data-active="${strat.is_active}">
                                    ${toggleActionLabel}
                                </button>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                // Wire click events dynamically on generated edit buttons
                tableBody.querySelectorAll('.btn-edit-action').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const stratId = parseInt(e.currentTarget.getAttribute('data-id'), 10);
                        openEditModal(stratId);
                    });
                });

                // Wire click events dynamically on generated status toggle buttons
                tableBody.querySelectorAll('.btn-toggle-status-action').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const stratId = parseInt(e.currentTarget.getAttribute('data-id'), 10);
                        const stratName = e.currentTarget.getAttribute('data-name');
                        const isCurrentActive = e.currentTarget.getAttribute('data-active') === 'true';
                        toggleStrategyStatus(stratId, stratName, isCurrentActive);
                    });
                });
            }

            // Open Modal in EDIT mode
            function openEditModal(stratId) {
                const strat = loadedStrategiesList.find(s => s.id === stratId);
                if (!strat) return;

                editingStrategyId = stratId;
                elModalTitle.textContent = `Edit Strategy (ID: ${stratId})`;
                btnSave.textContent = "Save Changes";

                inputName.value = strat.name;
                inputDesc.value = strat.description || '';
                btnSave.disabled = false; // Initial values are valid
                backdrop.classList.add('show');
                inputName.focus();
            }

            // Toggle Strategy Active Status (PATCH request with Confirmation Dialog)
            async function toggleStrategyStatus(stratId, stratName, isCurrentlyActive) {
                // Construct requirement-compliant confirmation phrasing
                const promptMsg = isCurrentlyActive 
                    ? `Disable strategy '${stratName}'? This will stop execution of this strategy for all clients until it is enabled again.`
                    : `Enable strategy '${stratName}'?`;

                if (!window.confirm(promptMsg)) {
                    return; // user cancelled confirmation
                }

                const accessToken = localStorage.getItem('access_token');
                if (!accessToken) return;

                try {
                    const response = await fetch(`${window.API_BASE_URL}/api/v1/master/strategies/${stratId}/status`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            is_active: !isCurrentlyActive
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Failed to change strategy status. Status: ${response.status}`);
                    }

                    // Reload full table using GET catalog query
                    await loadStrategies();
                } catch (error) {
                    console.error("Failed to toggle strategy status:", error);
                    alert("Failed to modify strategy status. Please check server logs.");
                }
            }

            // Save Strategy (Send POST or PUT request to backend API)
            btnSave.addEventListener('click', async () => {
                const nameVal = inputName.value.trim();
                const descVal = inputDesc.value.trim() || '';

                if (!nameVal) return;

                const accessToken = localStorage.getItem('access_token');
                if (!accessToken) return;

                // Disable submit button temporarily to prevent duplicate clicks
                btnSave.disabled = true;

                const isEdit = editingStrategyId !== null;
                const requestUrl = isEdit 
                    ? `${window.API_BASE_URL}/api/v1/master/strategies/${editingStrategyId}`
                    : `${window.API_BASE_URL}/api/v1/master/strategies`;
                const requestMethod = isEdit ? 'PUT' : 'POST';

                try {
                    const response = await fetch(requestUrl, {
                        method: requestMethod,
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: nameVal,
                            description: descVal
                        })
                    });

                    if (response.status === 400) {
                        const errData = await response.json();
                        alert(errData.detail || "Validation failed: Strategy name already exists.");
                        btnSave.disabled = false;
                        inputName.focus();
                        return;
                    }

                    if (!response.ok) {
                        throw new Error(`Failed to save strategy. Status: ${response.status}`);
                    }

                    // Success: close modal and load refreshed backend list
                    closeModal();
                    await loadStrategies();
                } catch (error) {
                    console.error("Save strategy failure:", error);
                    alert("Failed to save strategy. Please check server logs.");
                    btnSave.disabled = false;
                }
            });

            // Initial load
            loadStrategies();
        });
    </script>
</body>
</html>
