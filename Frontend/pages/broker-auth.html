<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broker Authentication Required - Your Platform Name</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="../css/pages/broker-auth.css">

    <!-- Import JavaScript controller -->
    <script src="../js/pages/broker-auth.js" defer></script>
</head>
<body>

    <div class="auth-card">
        <!-- Logo Header -->
        <div class="logo-section">
            <div class="logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                    <polyline points="16 7 22 7 22 13"></polyline>
                </svg>
            </div>
            <div class="logo-text">
                <h2>Your Platform Name</h2>
            </div>
        </div>

        <!-- Page Titles -->
        <div class="auth-header">
            <h2>Broker Authentication Required</h2>
            <p>Your broker account needs authentication before you can continue.</p>
        </div>

        <!-- Action Section -->
        <div class="action-section">
            <button id="btn-connect" class="btn-primary">Connect to Zerodha</button>
            <button id="btn-setup" class="btn-secondary">Update Credentials</button>
            <button id="btn-logout" class="btn-text">Logout</button>
        </div>
    </div>

</body>
</html>
