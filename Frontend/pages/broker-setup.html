<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broker Setup - Your Platform Name</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="../css/pages/broker-setup.css">

    <!-- External JavaScript -->
    <script src="../js/pages/broker-setup.js" defer></script>
</head>
<body>

    <div class="setup-container">
        <div class="setup-card">
            <!-- Brand Logo Header -->
            <div class="logo-section">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                        <polyline points="16 7 22 7 22 13"></polyline>
                    </svg>
                </div>
                <span class="logo-text">Your Platform Name</span>
            </div>

            <!-- Page Titles -->
            <div class="setup-header">
                <h2>Connect Zerodha Developer Account</h2>
                <p>Enter your Zerodha Developer API credentials to continue.</p>
            </div>

            <!-- Alert Areas -->
            <div id="error-banner" class="alert-banner error" style="display: none;">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="error-message"></span>
            </div>

            <div id="success-banner" class="alert-banner success" style="display: none;">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span id="success-message">Broker credentials saved successfully</span>
            </div>

            <!-- Setup Form -->
            <form id="setup-form">
                <!-- API Key -->
                <div class="form-group">
                    <label class="form-label" for="api-key">API Key</label>
                    <div class="input-wrapper">
                        <span class="input-icon-start">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input class="form-input" type="password" id="api-key" placeholder="Enter Zerodha API Key" required autocomplete="off">
                        <button class="input-icon-end" type="button" id="btn-toggle-key">
                            <svg id="eye-icon-key" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- API Secret -->
                <div class="form-group">
                    <label class="form-label" for="api-secret">API Secret</label>
                    <div class="input-wrapper">
                        <span class="input-icon-start">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input class="form-input" type="password" id="api-secret" placeholder="Enter Zerodha API Secret" required autocomplete="off">
                        <button class="input-icon-end" type="button" id="btn-toggle-secret">
                            <svg id="eye-icon-secret" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Notice Box -->
                <div class="notice-box">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <p>Your credentials are encrypted before storage and are never displayed again.</p>
                </div>

                <!-- Submit Button -->
                <button class="btn-submit" type="submit" id="btn-submit">
                    <span id="btn-text">Save & Continue</span>
                </button>
            </form>
        </div>
    </div>

</body>
</html>
