<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Signal Monitor — view all accepted trading signals and their lifecycle status.">
    <title>Signal Monitor - Market Platform</title>

    <link rel="stylesheet" href="../css/pages/common.css">
    <link rel="stylesheet" href="../css/pages/signal-monitor.css">
</head>
<body>
    <!-- App Header (rendered by common.js) -->
    <header class="app-header" id="header-section">
        <div class="header-container">
            <div class="header-left">
                <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <h1>Market Dashboard</h1>
                <nav class="header-nav"></nav>
            </div>
            <div class="header-right">
                <span id="header-clock" class="header-clock">--:--:-- --</span>
                <button class="theme-toggle" aria-label="Toggle Theme">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="signal-monitor-container" id="signal-monitor-main">

        <!-- Page Header -->
        <div class="page-header">
            <h2>Signal Monitor</h2>
            <div class="page-header-meta">
                <span class="signal-count-badge" id="signal-count-badge">— signals</span>
                <button class="btn-refresh" id="btn-refresh" aria-label="Refresh signals">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
                    Refresh
                </button>
            </div>
        </div>

        <!-- Signal Table Card -->
        <div class="signals-card">
            <div class="table-responsive">
                <table class="signals-table" id="signals-table" aria-label="Accepted Signals">
                    <thead>
                        <tr>
                            <th scope="col">Time</th>
                            <th scope="col">Symbol</th>
                            <th scope="col">Action</th>
                            <th scope="col">TF</th>
                            <th scope="col" class="text-right">Entry</th>
                            <th scope="col" class="text-right">Stop Loss</th>
                            <th scope="col" class="text-right">Target 1</th>
                            <th scope="col" class="text-right">Target 2</th>
                            <th scope="col" class="text-right">Target 3</th>
                            <th scope="col">Status</th>
                            <th scope="col">Validation</th>
                            <!-- Future columns reserved: LTP, P&L, Active Target, Client Count, Filled Qty, Actions -->
                            <th scope="col" class="text-right">ID</th>
                        </tr>
                    </thead>
                    <tbody id="signals-table-body">
                        <!-- Populated by signal-monitor.js -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="../js/api/config.js" defer></script>
    <script src="../js/common.js" defer></script>
    <script src="../js/pages/signal-monitor.js" defer></script>
</body>
</html>
