<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifying Broker Session - Your Platform Name</title>

    
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="../css/pages/broker-callback.css">

    <!-- Import JavaScript controller -->
    <script src="../js/pages/broker-callback.js" defer></script>
</head>
<body>

    <div class="callback-card">
        <!-- Logo Header -->
        <div class="logo-section">
            <div class="logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                    <polyline points="16 7 22 7 22 13"></polyline>
                </svg>
            </div>
            <div class="logo-text">
                <h2>Your Platform Name</h2>
            </div>
        </div>

        <!-- Page Titles -->
        <div class="callback-header">
            <h2>Completing Broker Authentication</h2>
            <p>Please wait while we securely verify your broker session.</p>
        </div>

        <!-- Spinner -->
        <div id="spinner" class="spinner"></div>

        <!-- Loading / Status Message -->
        <div id="status-text" class="status-text">Verifying broker session...</div>

        <!-- Error Container -->
        <div id="error-box" class="error-box"></div>

        <!-- Success Banner -->
        <div id="success-banner" class="success-banner">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span id="success-message">Broker connected successfully</span>
        </div>

        <!-- Action / Return to Login button -->
        <button id="btn-login" class="btn-login">Return to Login</button>

        <!-- Recovery options container -->
        <div id="recovery-actions" class="recovery-actions">
            <button id="btn-retry" class="btn-primary">Try Again</button>
            <button id="btn-setup" class="btn-secondary">Update Credentials</button>
        </div>
    </div>

</body>
</html>
