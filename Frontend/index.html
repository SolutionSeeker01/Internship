<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Dashboard</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Link external styling stylesheets -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/instruments.css">
</head>
<body>
    <header class="app-header" id="header-section">
        <div class="header-container">
            <div class="header-left">
                <!-- SVG Icon mimicking TradingView/Zerodha style -->
                <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <h1>Market Dashboard</h1>
                <nav class="header-nav">
                    <button class="nav-btn active" id="nav-btn-dashboard">Dashboard</button>
                    <button class="nav-btn" id="nav-btn-instruments">Instrument Manager</button>
                </nav>
            </div>
            <!-- Connection status indicator & Header info -->
            <div class="header-right">
                <span id="connection-status-dot" class="status-dot disconnected"></span>
                <span id="connection-status-text" class="status-text">Disconnected</span>
                <span id="header-clock" class="header-clock">--:--:-- --</span>
                <button class="theme-toggle" aria-label="Toggle Theme">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="dashboard-container" id="dashboard-layout">
        <!-- Top Section: Indices Grid -->
        <section class="indices-section" id="market-section" aria-label="Indices Section">
            <h2>Market Indices</h2>
            <div class="indices-grid" id="indices-container">
                <!-- Dynamically populated via JS -->
            </div>
        </section>

        <!-- Bottom Section: Stocks Watchlist (using id sidebar as example of secondary panel) -->
        <section class="stocks-section" id="sidebar" aria-label="Stocks Section">
            <h2>Watchlist Stocks</h2>
            <div id="watchlist-notification" class="watchlist-notification" style="display: none;"></div>
            <div class="table-responsive">
                <table class="stocks-table" id="watchlist-table">
                    <thead>
                        <tr>
                            <th scope="col">Symbol</th>
                            <th scope="col" class="text-right">LTP</th>
                            <th scope="col" class="text-right">Change %</th>
                            <th scope="col" class="text-right">Bid</th>
                            <th scope="col" class="text-right">Ask</th>
                            <th scope="col" class="text-right">Volume</th>
                            <th scope="col" class="text-right">Open</th>
                            <th scope="col" class="text-right">Close</th>
                        </tr>
                    </thead>
                    <tbody id="stocks-table-body">
                        <!-- Dynamically populated via JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Candlestick Chart Section -->
        <section class="chart-section" id="chart-section">
            <div class="chart-header-row">
                <h2 id="chart-title">RELIANCE - 1 Minute Candles</h2>
                <div class="timeframe-selector" id="timeframe-selector">
                    <button class="timeframe-btn active" data-interval="minute">1m</button>
                    <button class="timeframe-btn" data-interval="3minute">3m</button>
                    <button class="timeframe-btn" data-interval="5minute">5m</button>
                    <button class="timeframe-btn" data-interval="15minute">15m</button>
                    <button class="timeframe-btn" data-interval="30minute">30m</button>
                    <button class="timeframe-btn" data-interval="60minute">1h</button>
                    <button class="timeframe-btn" data-interval="day">1D</button>
                </div>
            </div>
            <div id="chart-container"></div>
        </section>
    </main>

    <!-- Instrument Manager Section -->
    <main class="instruments-layout" id="instruments-layout" style="display: none;">
        <div class="instruments-grid-container">
            <!-- Left Side: Add Instrument Form -->
            <section class="instrument-form-card" aria-label="Add Instrument Section">
                <h2 style="font-size: 14px; font-weight: 700; color: var(--text-primary); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Add Instrument</h2>
                <form id="add-instrument-form" onsubmit="event.preventDefault(); handleAddInstrumentSubmit();" style="display: flex; flex-direction: column; gap: 14px;">
                    <div class="form-group">
                        <label for="form-symbol">Symbol</label>
                        <input type="text" id="form-symbol" placeholder="e.g. RELIANCE" required>
                    </div>
                    <div class="form-group">
                        <label for="form-token">Token</label>
                        <input type="number" id="form-token" placeholder="e.g. 738561" required>
                    </div>
                    <div class="form-group">
                        <label for="form-exchange">Exchange</label>
                        <select id="form-exchange" required>
                            <option value="NSE" selected>NSE</option>
                            <option value="BSE">BSE</option>
                            <option value="NFO">NFO</option>
                            <option value="MCX">MCX</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="form-name">Name</label>
                        <input type="text" id="form-name" placeholder="e.g. RELIANCE INDUSTRIES" required>
                    </div>
                    <div class="form-group">
                        <label for="form-segment">Segment</label>
                        <select id="form-segment" required>
                            <option value="EQ" selected>EQ (Equity)</option>
                            <option value="IND">IND (Index)</option>
                            <option value="FUT">FUT (Futures)</option>
                            <option value="OPT">OPT (Options)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="form-category">Category</label>
                        <select id="form-category" required>
                            <option value="STOCK" selected>STOCK</option>
                            <option value="INDEX">INDEX</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="form-broker">Broker</label>
                        <input type="text" id="form-broker" value="ZERODHA" placeholder="e.g. ZERODHA" required>
                    </div>
                    <button type="submit" class="btn-primary">Add Instrument</button>
                </form>
            </section>

            <!-- Right Side: Existing Instruments Table -->
            <section class="table-responsive" style="margin-top: 0; max-height: calc(100vh - 200px);" aria-label="Existing Instruments Table">
                <table class="stocks-table">
                    <thead>
                        <tr>
                            <th scope="col">Symbol</th>
                            <th scope="col">Token</th>
                            <th scope="col">Exchange</th>
                            <th scope="col">Name</th>
                            <th scope="col">Segment</th>
                            <th scope="col">Broker</th>
                            <th scope="col">Category</th>
                            <th scope="col" class="text-right" style="padding-right: 24px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="instruments-table-body">
                        <!-- Dynamically populated via JS -->
                    </tbody>
                </table>
            </section>
        </div>
    </main>

    <footer class="app-footer">
        <div class="footer-container">
            <div class="market-breadth">
                <span class="breadth-item advances">Advances: <span id="breadth-advances">0</span></span>
                <span class="breadth-item declines">Declines: <span id="breadth-declines">0</span></span>
                <span class="breadth-item unchanged">Unchanged: <span id="breadth-unchanged">0</span></span>
            </div>
            <div class="footer-right">
                <span class="last-updated">Last updated: <span id="last-updated-time">--:--:-- --</span></span>
                <span class="refresh-btn" onclick="location.reload();">↻</span>
            </div>
        </div>
    </footer>

    <!-- Load TradingView Lightweight Charts production CDN -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    
    <!-- Load application scripts -->
    <script src="js/api.js"></script>
    <script src="js/instruments.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
